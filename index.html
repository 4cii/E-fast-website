<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Report Website</title>

    <link rel="stylesheet" href="css/style.css" />
    <script type="text/javascript" src="js/darkmode.js" defer></script>
  </head>
  <body>
    <!-- switch -->
    <div id="theme-switch">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon preview-icon"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun preview-icon"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
    </div>

    <!-- report page -->
    <div class="report-page" id="page-report">
      
      <!-- content -->
      <div class="content">
        <!-- Navbar -->
        <div class="navbar">
          <a class="logo" href="#report"
            ><img class="fast" src="assets/images/fast.svg" alt="E-fast logo"
          /></a>
          <div class="btn-nav">
            <a class="btn-nav-item" href="#report">Report</a>
            <a class="btn-nav-item" href="#dashboard">Dashboard</a>
          </div>
        </div>

        <!-- head -->
        <div class="heading">
          <h1 class="title-main">E-REPORT</h1>
          <h1 class="title-web">WEB</h1>
          <div class="element-desc">Broken Facility</div>
        </div>
      </div>
      <!-- form -->
      <div class="form" id="facility-report-form">
        <div class="form-panel">
          <button class="btn-slide" aria-label="Buka form"><</button>

          <div class="form-body">
            <form class="report-form">
              <h2 class="form-title">Your Report>></h2>

              <div class="form-first-line">
                <div class="field field-name">
                  <label for="input-reporter">Reporter</label>
                  <input
                    id="input-reporter"
                    name="reporter" 
                    type="text"
                    placeholder="Full Name - Class"
                  />
                </div>

                <div class="field field-category">
                  <label for="select-category">Category</label>
                  <div class="select-wrap">
                    <select id="select-category" name="category">
                      <option value="" disabled selected>
                        Choose category
                      </option>
                      <option value="Furniture">Furniture</option>
                      <option value="Electrical">Electrical</option>
                      <option value="Plumbing">Plumbing</option>
                      <option value="Electronics">Electronics</option>
                      <option value="Building">Building</option>
                      <option value="Others">Others</option>
                    </select>
                    <span class="select-dot"></span>
                  </div>
                </div>
              </div>

              <div class="form-second-line">
                <div class="field field-desc">
                  <label for="description">Description</label>
                  <textarea
                    id="description"
                    placeholder="Write the report"
                    name="description"
                    maxlength="200"
                  ></textarea>
                </div>

                <button class="btn-submit" type="submit">RE →<br />PORT</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- petunjuk -->
      <span class="slide-hint">Slide me :DD</span>
    </div>

    <!-- dashboard -->
    <div class="dashboard-page" id="page-dashboard" hidden>
      <!-- content -->
      <div class="content">
        <!-- Navbar -->
        <div class="navbar">
          <a class="logo" href="#report"
            ><img class="fast" src="assets/images/fast.svg" alt="E-fast logo"
          /></a>
          <div class="btn-nav">
            <a class="btn-nav-item" href="#report">Report</a>
            <a class="btn-nav-item" href="#dashboard">Dashboard</a>
          </div>
        </div>
      </div>

      <h1 class="dash-title">DASHBOARD</h1>

      <div class="stats">
        <article class="stat-card">
          <h2 class="stat-label">
            <strong>TOTAL</strong><span>Broken Facility</span>
          </h2>
          <p class="stat-number" id="stat-total">0</p>
        </article>
        <article class="stat-card">
          <h2 class="stat-label">
            <strong>FINISHED</strong><span>Broken Facility</span>
          </h2>
          <p class="stat-number" id="stat-finished">0</p>
        </article>
        <div class="stat-pill" aria-hidden="true"></div>
      </div>
      <!-- data -->
  <h1 class="data-title">Data Report -></h1>

  <table class="report-table">
    <thead>
      <tr>
        <th>Reporter</th>
        <th>Category</th>
        <th>Description</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="reports-table-body">
      
    </tbody>
  </table>

    </div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/script.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
